<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
    <meta charset="UTF-8">
    <!-- Content Security Policy - GitHub Pages対応版 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
    <!-- Viewport for Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音声文字起こしアプリ</title>
    <!-- シンプルなファビコン対応 -->
    <link rel="icon" href="data:,">
    <!-- 正しいファイル名に修正 -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>音声文字起こしアプリ</h1>
            <button id="theme-toggle" class="theme-toggle" aria-label="テーマ切替">
                <span class="toggle-track"></span>
            </button>
        </header>
        
        <main>
            <div class="status-bar">
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span id="status-text">待機中</span>
                </div>
                <div class="word-count">文字数: <span id="character-count">0</span></div>
            </div>
            
            <div class="transcript-container">
                <div class="transcript-actions">
                    <button id="clear-btn" class="action-btn" disabled aria-label="クリア">
                        <span class="btn-icon clear-icon"></span>
                    </button>
                    <button id="copy-btn" class="action-btn" disabled aria-label="コピー">
                        <span class="btn-icon copy-icon"></span>
                    </button>
                </div>
                <textarea id="transcript" placeholder="ここに文字起こしされたテキストが表示されます..." readonly aria-label="文字起こし結果"></textarea>
            </div>
            
            <div class="controls">
                <button id="start-btn" class="btn primary-btn" aria-label="録音開始">
                    <span class="btn-icon record-icon"></span>
                    <span class="btn-text">録音開始</span>
                </button>
                <button id="stop-btn" class="btn danger-btn" disabled aria-label="録音停止">
                    <span class="btn-icon stop-icon"></span>
                    <span class="btn-text">録音停止</span>
                </button>
                <button id="download-btn" class="btn secondary-btn" disabled aria-label="CSVダウンロード">
                    <span class="btn-icon download-icon"></span>
                    <span class="btn-text">CSVダウンロード</span>
                </button>
            </div>
        </main>
    </div>

    <div id="toast" class="toast" role="alert" aria-live="polite"></div>
    <script src="./app.js"></script>
</body>
</html>
