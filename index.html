<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
    <meta charset="UTF-8">
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self';">
    <!-- Viewport for Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音声文字起こしアプリ</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>音声文字起こしアプリ</h1>
            <button id="theme-toggle" aria-label="テーマ切替" title="ダークモード切替">
                <span class="icon light-icon">☀️</span>
                <span class="icon dark-icon">🌙</span>
            </button>
        </header>
        
        <main>
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span id="status-text">待機中</span>
            </div>
            
            <div class="controls">
                <button id="start-btn" class="btn primary-btn" aria-label="録音開始">
                    <span class="btn-icon">🎤</span>
                    <span class="btn-text">録音開始</span>
                </button>
                <button id="stop-btn" class="btn danger-btn" disabled aria-label="録音停止">
                    <span class="btn-icon">⏹️</span>
                    <span class="btn-text">録音停止</span>
                </button>
                <button id="download-btn" class="btn secondary-btn" disabled aria-label="CSVダウンロード">
                    <span class="btn-icon">📥</span>
                    <span class="btn-text">CSVダウンロード</span>
                </button>
            </div>
            
            <div class="transcript-container">
                <div class="transcript-header">
                    <h2>文字起こし結果</h2>
                    <div class="transcript-actions">
                        <button id="copy-btn" class="icon-btn" disabled aria-label="コピー" title="クリップボードにコピー">📋</button>
                        <button id="clear-btn" class="icon-btn" disabled aria-label="クリア" title="テキストをクリア">🗑️</button>
                    </div>
                </div>
                <textarea id="transcript" placeholder="ここに文字起こしされたテキストが表示されます..." readonly aria-label="文字起こし結果"></textarea>
                <div class="word-count">文字数: <span id="character-count">0</span></div>
            </div>
        </main>
        
        <footer>
            <p>© 2023 音声文字起こしアプリ</p>
        </footer>
    </div>

    <div id="toast" class="toast" role="alert" aria-live="polite"></div>
    <script src="app.js"></script>
</body>
</html>
